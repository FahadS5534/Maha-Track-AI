version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mahakumbh_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/mahakumbh.db
      - JWT_SECRET=mahakumbh-sanitation-secret-key-2026-secure
    volumes:
      - backend_data:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mahakumbh_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
